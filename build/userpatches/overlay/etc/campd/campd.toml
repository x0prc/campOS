# campOS default configuration.
# Everything here is a privacy-safe default; changes are opt-in.

[firewall]
default_deny = true
allowed_outbound_uids = []
allowed_domains = []

[mic]
kill_switch = false
block_usb_mics = true
block_internal_mics = true

[dns]
# Local files or http(s) URLs. URL lists load via `campctl dns fetch`
# (cache in /var/cache/campd/blocklists); boot-time `apply` never fetches.
blocklists = ["https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts"]
listen = "127.0.0.1"
port = 53
# Upstream resolvers (dnsmasq no-resolv; never loops through resolv.conf).
upstream = ["9.9.9.9", "149.112.112.112"]

[waydroid]
auto_freeze = true
freeze_delay_s = 60
